<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse Inspector</title>
<style>
  /* Self-contained by principle: local-first means no font CDN calls either.
     System stacks, chosen per-platform: SF Mono/Cascadia for data, the OS UI
     face for prose, Georgia's true italic for the wordmark. */
  :root {
    --paper: #F6F5F1; --card: #FFFFFF; --ink: #16181B; --mute: #5C6169;
    --faint: #969BA3; --line: #E4E3DE; --wash: #EEEDE7;
    --cobalt: #2853D6; --green: #0F8A68; --amber: #A96F0E; --red: #C43D2E; --slate: #1F7F9E;
    --tag-bg: #2853D614; --select: #2853D626; --scrim: rgba(22,24,27,.30);
    --drawer-shadow: -16px 8px 40px rgba(22,24,27,.10);
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: Georgia, "Times New Roman", serif;
  }
  /* Dark is composed, not inverted: warm-black paper, cards one step lighter,
     accents lifted in lightness so they hold ≥4.5:1 on the dark card. */
  [data-theme="dark"] {
    --paper: #121417; --card: #1A1D21; --ink: #E9E9E5; --mute: #A7ABB1;
    --faint: #7B8087; --line: #2A2D32; --wash: #23262B;
    --cobalt: #7C9BFF; --green: #4CC9A0; --amber: #E0A83E; --red: #EE8273; --slate: #5FC2E0;
    --tag-bg: #7C9BFF1F; --select: #7C9BFF33; --scrim: rgba(0,0,0,.55);
    --drawer-shadow: -16px 8px 40px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.55 var(--sans); background: var(--paper); color: var(--ink); }
  body, header, .stat-card, .feed-item, .drawer, input, select, button {
    transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease; }
  ::selection { background: var(--select); }
  :focus-visible { outline: 2px solid var(--cobalt); outline-offset: 1px; border-radius: 2px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 18px 28px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .wordmark { font-family: var(--serif); font-style: italic;
    font-size: 24px; font-weight: 400; letter-spacing: .01em; }
  .wordmark small { font-family: var(--mono); font-style: normal; font-size: 10px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--faint); margin-left: 10px; vertical-align: 2px; }
  .tabs { display: flex; gap: 4px; }
  .tab-btn { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    background: none; border: none; color: var(--mute); padding: 10px 14px 14px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--cobalt); }

  .tab-panel { display: none; max-width: 960px; margin: 0 auto; padding: 22px 28px 48px; }
  .tab-panel.active { display: block; }

  .feed-controls { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  input, select, button { font: 13px/1.4 var(--sans); color: var(--ink); }
  .feed-controls select, .feed-controls input {
    background: var(--card); border: 1px solid var(--line); padding: 5px 9px; border-radius: 6px; }
  .feed-controls button { background: var(--card); border: 1px solid var(--line);
    padding: 5px 13px; border-radius: 6px; cursor: pointer; }
  .feed-controls button:hover { border-color: var(--faint); }

  /* The spine: every event row carries a colored left tick — the feed reads as a
     seismogram of memory activity. */
  .feed-item { display: flex; gap: 12px; align-items: flex-start; padding: 8px 14px;
    border-left: 2px solid transparent; border-bottom: 1px solid var(--line);
    font-family: var(--mono); font-size: 12.5px; background: var(--card); }
  .feed-item:first-child { border-top-left-radius: 8px; border-top-right-radius: 8px; }
  .feed-item:last-child { border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
  #feed-list, #mem-list { border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden; }
  #feed-list:empty, #mem-list:empty { border: none; }
  #feed-list .feed-item, #mem-list .feed-item { border-radius: 0; }
  #feed-list .feed-item:last-child, #mem-list .feed-item:last-child { border-bottom: none; }
  .act-write    { border-left-color: var(--green); }
  .act-retrieve { border-left-color: var(--cobalt); }
  .act-supersede{ border-left-color: var(--amber); }
  .act-feedback { border-left-color: var(--red); }
  .act-dedup, .act-absorb { border-left-color: var(--slate); }
  .act-job, .act-export, .act-purge { border-left-color: var(--faint); }
  .act-label { width: 78px; flex-shrink: 0; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--mute); padding-top: 2px; }
  .feed-item .detail { flex: 1; overflow-wrap: anywhere; }
  .feed-item .time { color: var(--faint); font-size: 11px; flex-shrink: 0; padding-top: 1px; }
  .clickable { color: var(--cobalt); cursor: pointer; text-decoration: none; }
  .clickable:hover { text-decoration: underline; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  th { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--mute); font-weight: 500; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
  .stat-card h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--mute); font-weight: 500; margin-bottom: 10px; }
  .stat-card pre { font-family: var(--mono); }

  .drawer-overlay { display: none; position: fixed; inset: 0; background: var(--scrim); z-index: 100; }
  .drawer-overlay.open { display: flex; justify-content: flex-end; }
  .drawer { width: 480px; max-width: 92vw; background: var(--card); border-left: 1px solid var(--line);
    box-shadow: var(--drawer-shadow); overflow-y: auto; padding: 24px; height: 100vh;
    position: relative; animation: slide-in 200ms cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes slide-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* The heartbeat: a new event lands with a pulse of its own action color that
     settles into the resting row — the seismogram registers the beat. */
  @media (prefers-reduced-motion: no-preference) {
    .feed-item.fresh { animation: land 500ms cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes land {
      from { transform: translateY(-5px); opacity: 0; background: var(--wash); }
      40% { opacity: 1; }
      to { transform: none; background: var(--card); }
    }
    .bar-anim { transform-box: fill-box; transform-origin: bottom;
      animation: grow 420ms cubic-bezier(0.16, 1, 0.3, 1) backwards; }
    @keyframes grow { from { transform: scaleY(0); } }
    .tab-btn { transition: color 140ms ease, border-bottom-color 140ms ease; }
    .feed-controls button, .clickable { transition: color 120ms ease, border-color 120ms ease; }
    #theme-toggle { transition: transform 300ms cubic-bezier(0.16, 1, 0.3, 1), color 140ms ease; }
    [data-theme="dark"] #theme-toggle { transform: rotate(180deg); }
  }
  #theme-toggle, #guide-btn { font-size: 13px; padding: 8px 10px 12px; }
  .guide-tick { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    vertical-align: -1px; margin-right: 6px; }
  .guide-row { margin-bottom: 8px; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
  .drawer h2 { font-size: 16px; line-height: 1.4; margin-bottom: 14px; padding-right: 28px; }
  .drawer h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--mute); font-weight: 500; margin-top: 18px; margin-bottom: 6px; }
  .drawer .field { margin-bottom: 7px; font-size: 13px; }
  .drawer .field-label { font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); display: inline-block; width: 96px; }
  .drawer code { font-family: var(--mono); font-size: 12px; background: var(--wash);
    padding: 1px 5px; border-radius: 4px; }
  .drawer .close-btn { position: absolute; top: 14px; right: 14px; background: none; border: none;
    color: var(--mute); cursor: pointer; font-size: 18px; line-height: 1; }
  .drawer .close-btn:hover { color: var(--ink); }

  .qualifier { font-family: var(--mono); color: var(--amber); font-size: 11px; margin-left: 4px; }
  .score-bar { height: 5px; background: var(--wash); border-radius: 3px; overflow: hidden; margin: 2px 0; }
  .score-bar-fill { height: 100%; border-radius: 3px; }
  .empty { color: var(--faint); padding: 28px; text-align: center; font-size: 13px; }
  .tag { display: inline-block; font-family: var(--mono); font-size: 11px;
    background: var(--tag-bg); color: var(--cobalt); padding: 1px 6px; border-radius: 4px; margin: 1px 2px; }
  .status-active { color: var(--green); }
  .status-superseded { color: var(--faint); text-decoration: line-through; }
  .status-disputed { color: var(--amber); }
  .meta-row { display: flex; gap: 8px; font-size: 12px; color: var(--mute); align-items: center; }
</style>
</head>
<body>
<header>
  <h1 class="wordmark">Synapse<small>inspector</small></h1>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="feed">Feed</button>
    <button class="tab-btn" data-tab="memories">Memories</button>
    <button class="tab-btn" data-tab="analytics">Analytics</button>
    <button class="tab-btn" data-tab="health">Health</button>
    <button class="tab-btn" id="guide-btn" aria-label="What am I looking at?" title="What am I looking at?">?</button>
    <button class="tab-btn" id="theme-toggle" aria-pressed="false" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
  </nav>
</header>

<div id="feed-tab" class="tab-panel active">
  <div class="feed-controls">
    <select id="feed-action-filter">
      <option value="">All actions</option>
      <option value="write">Writes</option>
      <option value="retrieve">Retrievals</option>
      <option value="supersede">Supersedes</option>
      <option value="feedback">Feedback</option>
      <option value="dedup">Dedups</option>
      <option value="absorb">Absorbs</option>
    </select>
    <input id="feed-search" type="text" placeholder="Filter text…" style="flex:1;max-width:220px">
    <button id="feed-pause">Pause</button>
  </div>
  <div id="feed-list"></div>
</div>

<div id="memories-tab" class="tab-panel">
  <div class="feed-controls">
    <input id="mem-search" type="text" placeholder="Search memories…" style="flex:1;max-width:320px">
    <select id="mem-type-filter">
      <option value="">All types</option>
      <option value="semantic">Semantic</option>
      <option value="procedural">Procedural</option>
      <option value="episodic">Episodic</option>
      <option value="working">Working</option>
    </select>
    <button id="mem-search-btn">Search</button>
    <button id="mem-list-btn">List all</button>
  </div>
  <div id="mem-list"></div>
</div>

<div id="health-tab" class="tab-panel">
  <div id="health-content"></div>
</div>

<div id="analytics-tab" class="tab-panel">
  <div id="analytics-content"></div>
</div>

<div id="drawer-overlay" class="drawer-overlay">
  <div class="drawer" id="drawer">
    <button class="close-btn" id="drawer-close" aria-label="Close">×</button>
    <div id="drawer-content"></div>
  </div>
</div>

<script>
const API = window.location.origin;
let feedPaused = false;
let feedInterval = null;
let lastSeenEventId = null;

// --- Theme ---
const savedTheme = localStorage.getItem("synapse-theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
const themeBtn = document.getElementById("theme-toggle");
function syncThemeBtn() {
  const dark = document.documentElement.dataset.theme === "dark";
  themeBtn.setAttribute("aria-pressed", String(dark));
  themeBtn.title = dark ? "Switch to light mode" : "Switch to dark mode";
}
syncThemeBtn();
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("synapse-theme", next);
  syncThemeBtn();
});

// --- Guide ---
function showGuide() {
  document.getElementById("drawer-overlay").classList.add("open");
  const tick = (v) => `<span class="guide-tick" style="background:var(--${v})"></span>`;
  document.getElementById("drawer-content").innerHTML = `
    <h2>What you're looking at</h2>
    <p style="font-size:13px;color:var(--mute)">This inspector is the window into your agent's memory.
    Everything here lives in one SQLite file on your machine — nothing leaves it.</p>
    <h3>Feed</h3>
    <p class="guide-row">A live log of everything that happens to memory. Each row's colored tick names the event:</p>
    <div class="guide-row">${tick("green")}<b>write</b> — a new memory was stored</div>
    <div class="guide-row">${tick("cobalt")}<b>retrieve</b> — the agent searched its memory</div>
    <div class="guide-row">${tick("amber")}<b>supersede</b> — a newer fact replaced an older one</div>
    <div class="guide-row">${tick("slate")}<b>dedup / absorb</b> — a near-duplicate was caught instead of stored twice</div>
    <div class="guide-row">${tick("red")}<b>feedback</b> — the agent flagged a memory as helpful, stale, or wrong</div>
    <h3>Memories</h3>
    <p class="guide-row">Browse or search everything stored. Click any memory to open its full record:
    provenance, links to the memories it superseded or derived from, and its event history.
    The small bars under search results break the relevance score into its parts
    (vector · keyword · importance · recency).</p>
    <h3>Analytics</h3>
    <p class="guide-row">Is the memory earning its keep? Activity over time, retrieval speed and
    quality, which memories get used most — and how many never get retrieved at all.</p>
    <h3>Health</h3>
    <p class="guide-row">Counts by type and status, embedding coverage and provider, background job
    results, and the digest — the facts your agent is told at the start of every session.</p>
    <p style="margin-top:16px;font-size:12px;color:var(--faint)">Reopen this guide anytime with the
    <b>?</b> in the header. Toggle light/dark with <b>◐</b>.</p>`;
}
document.getElementById("guide-btn").addEventListener("click", showGuide);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.getElementById("drawer-overlay").classList.remove("open");
});
if (!localStorage.getItem("synapse-guide-seen")) {
  localStorage.setItem("synapse-guide-seen", "1");
  showGuide();
}

// --- Tab switching ---
document.querySelectorAll(".tab-btn[data-tab]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn[data-tab]").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab + "-tab").classList.add("active");
    if (btn.dataset.tab === "feed" && !feedPaused) startFeed();
    if (btn.dataset.tab === "health") loadHealth();
    if (btn.dataset.tab === "analytics") loadAnalytics();
    if (btn.dataset.tab === "memories") loadMemories("", "");
  });
});

// --- Drawer ---
function openDrawer(id) {
  document.getElementById("drawer-overlay").classList.add("open");
  loadDrawer(id);
}
document.getElementById("drawer-close").addEventListener("click", () => {
  document.getElementById("drawer-overlay").classList.remove("open");
});
document.getElementById("drawer-overlay").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) document.getElementById("drawer-overlay").classList.remove("open");
});

async function loadDrawer(id) {
  const res = await fetch(`${API}/v1/memories/${id}`);
  if (!res.ok) { document.getElementById("drawer-content").innerHTML = '<div class="empty">Memory not found — it may have been purged.</div>'; return; }
  const m = await res.json();
  const decayPct = Math.round((1 - Math.pow(0.5, daysSince(m.createdAt) / m.decayHalfLifeDays)) * 100);
  document.getElementById("drawer-content").innerHTML = `
    <h2>${esc(m.content)}</h2>
    <div class="field"><span class="field-label">Type</span> ${m.type}</div>
    <div class="field"><span class="field-label">Status</span> <span class="status-${m.status}">${m.status}</span></div>
    <div class="field"><span class="field-label">Confidence</span> ${(m.confidence * 100).toFixed(0)}%</div>
    <div class="field"><span class="field-label">Importance</span> ${(m.importance * 100).toFixed(0)}%</div>
    <div class="field"><span class="field-label">Decay</span> ${decayPct}% (half-life ${m.decayHalfLifeDays}d)</div>
    ${m.structured?.entityKey ? `<div class="field"><span class="field-label">Entity key</span> <code>${esc(m.structured.entityKey)}</code></div>` : ""}
    <div class="field"><span class="field-label">Tags</span> ${(m.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join(" ") || "—"}</div>
    <div class="field"><span class="field-label">Sources</span> ${(m.sourceRefs || []).map(s => `${s.kind}:${s.id}`).join(", ") || "—"}</div>
    <div class="field"><span class="field-label">Retention</span> ${m.retention.mode}${m.retention.pinReason ? " — " + esc(m.retention.pinReason) : ""}</div>
    <h3>Links</h3>
    ${(m.resolvedLinks || []).map(l => `
      <div class="feed-item">
        <span class="act-label">${l.rel.replace(/_/g, " ")}</span>
        <span class="detail">
          <span class="clickable" onclick="openDrawer('${l.targetId}')">${esc(l.targetPreview)}</span>
          <span class="status-${l.targetStatus}" style="margin-left:4px;font-size:11px">(${l.targetStatus})</span>
        </span>
      </div>
    `).join("") || '<div class="empty">No links</div>'}
    <h3>Events</h3>
    ${(m.events || []).map(e => {
      const d = typeof e.detail === "string" ? e.detail : JSON.stringify(e.detail);
      return `<div class="feed-item act-${e.action}"><span class="detail">${esc(e.action)}: ${esc(d)}</span><span class="time">${formatTime(e.createdAt)}</span></div>`;
    }).join("") || '<div class="empty">No events</div>'}
  `;
}

// --- Feed ---
function renderFeedItem(e) {
  const d = typeof e.detail === "object" ? e.detail : (() => { try { return JSON.parse(e.detail); } catch { return { raw: e.detail }; } })();
  let text = "";
  const idLink = d.id ? `<span class="clickable" onclick="openDrawer('${d.id}')">${d.id}</span>` : "";
  switch (e.action) {
    case "write":
      text = `wrote ${esc(d.type)} "${esc((d.contentPreview || "").slice(0, 60))}" via ${esc(d.source || "api")}${d.entityKey ? ` (${esc(d.entityKey)})` : ""} ${idLink}`;
      break;
    case "retrieve":
      text = `retrieved ${(d.returnedIds || []).length} of ${d.candidateCount || 0} candidates for "${esc(d.query || "")}" (${d.latencyMs || 0}ms)`;
      break;
    case "supersede":
      text = `superseded <span class="clickable" onclick="openDrawer('${d.loserId}')">${(d.loserId || "").slice(0, 12)}</span> via ${d.via || "?"}`;
      if (d.winnerId) text += ` ← <span class="clickable" onclick="openDrawer('${d.winnerId}')">${(d.winnerId || "").slice(0, 12)}</span>`;
      break;
    case "feedback":
      text = `${d.verdict} on <span class="clickable" onclick="openDrawer('${d.id}')">${(d.id || "").slice(0, 12)}</span>`;
      break;
    case "dedup":
      text = `duplicate rejected — kept <span class="clickable" onclick="openDrawer('${d.keptId}')">${(d.keptId || "").slice(0, 12)}</span> (sim ${(d.sim ?? 0).toFixed(2)})`;
      break;
    case "absorb":
      text = `near-duplicate absorbed into <span class="clickable" onclick="openDrawer('${d.keptId}')">${(d.keptId || "").slice(0, 12)}</span> (sim ${(d.sim ?? 0).toFixed(2)})`;
      break;
    case "job":
      text = `${esc(d.kind || "job")} job finished — ${esc(summarizeJob(d))}`;
      break;
    case "export":
      text = `exported ${d.count ?? "all"} memories`;
      break;
    case "purge":
      text = `purged ${d.purged ?? d.count ?? ""} memories`;
      break;
    default:
      text = esc(d.raw || JSON.stringify(d));
  }
  const fresh = lastSeenEventId !== null && e.id > lastSeenEventId ? " fresh" : "";
  return `<div class="feed-item act-${e.action}${fresh}"><span class="act-label">${esc(e.action)}</span><span class="detail">${text}</span><span class="time">${formatTime(e.createdAt)}</span></div>`;
}

async function loadFeed() {
  const action = document.getElementById("feed-action-filter").value;
  const search = document.getElementById("feed-search").value.toLowerCase();
  const url = `${API}/v1/activity?limit=100${action ? "&action=" + action : ""}`;
  const res = await fetch(url);
  const { events } = await res.json();
  const filtered = search ? events.filter(e => JSON.stringify(e.detail).toLowerCase().includes(search)) : events;
  document.getElementById("feed-list").innerHTML = filtered.length
    ? filtered.map(renderFeedItem).join("")
    : '<div class="empty">No events yet. Write or retrieve a memory and it will appear here.</div>';
  if (events.length) lastSeenEventId = Math.max(...events.map(e => e.id));
}

function startFeed() { loadFeed(); feedInterval = setInterval(loadFeed, 3000); }
function stopFeed() { clearInterval(feedInterval); feedInterval = null; }

document.getElementById("feed-pause").addEventListener("click", () => {
  feedPaused = !feedPaused;
  document.getElementById("feed-pause").textContent = feedPaused ? "Resume" : "Pause";
  feedPaused ? stopFeed() : startFeed();
});
document.getElementById("feed-action-filter").addEventListener("change", loadFeed);
document.getElementById("feed-search").addEventListener("input", loadFeed);

// --- Memories tab ---
async function loadMemories(query, type) {
  let memories;
  if (query) {
    const res = await fetch(`${API}/v1/memories/retrieve`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, userId: "local", limit: 20, ...(type ? { types: [type] } : {}) }),
    });
    const data = await res.json();
    memories = data.memories || [];
  } else {
    const res = await fetch(`${API}/v1/memories`);
    const data = await res.json();
    memories = data.memories || data;
    if (type) memories = memories.filter(m => m.type === type);
  }
  document.getElementById("mem-list").innerHTML = memories.length
    ? memories.map(m => `
      <div class="feed-item" style="flex-direction:column;gap:5px;font-family:var(--sans);font-size:13.5px">
        <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">
          <span class="clickable" onclick="openDrawer('${m.id}')">${esc((m.content || "").slice(0, 80))}</span>
          ${m.qualifier ? `<span class="qualifier">${esc(m.qualifier)}</span>` : ""}
        </div>
        <div class="meta-row">
          <span class="tag">${m.type}</span>
          <span class="status-${m.status}">${m.status}</span>
          ${m.score != null ? `<span style="font-family:var(--mono);font-size:11px">score ${m.score.toFixed(3)}</span>` : ""}
          ${(m.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
        </div>
        ${m.scoreBreakdown ? renderScoreBreakdown(m.scoreBreakdown) : ""}
      </div>
    `).join("")
    : '<div class="empty">No memories found</div>';
}

function renderScoreBreakdown(bd) {
  const max = 0.5;
  const bars = [
    { label: "vector", value: bd.vector || 0, color: "var(--cobalt)" },
    { label: "keyword", value: bd.keyword || 0, color: "var(--green)" },
    { label: "importance", value: bd.importance || 0, color: "var(--amber)" },
    { label: "recency", value: bd.recency || 0, color: "var(--slate)" },
    { label: "decay", value: bd.decay || 0, color: "var(--red)" },
    { label: "conflict", value: bd.conflict || 0, color: "var(--red)" },
  ];
  return `<div style="display:flex;gap:6px;margin-top:2px;max-width:420px">${bars.map(b =>
    `<div title="${b.label}: ${b.value.toFixed(3)}" style="flex:1"><div class="score-bar"><div class="score-bar-fill" style="width:${Math.min(100, Math.abs(b.value) / max * 100)}%;background:${b.color}"></div></div><div style="font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--faint);text-align:center;text-transform:uppercase">${b.label.slice(0, 3)}</div></div>`
  ).join("")}</div>`;
}

document.getElementById("mem-search-btn").addEventListener("click", () => {
  loadMemories(document.getElementById("mem-search").value, document.getElementById("mem-type-filter").value);
});
document.getElementById("mem-list-btn").addEventListener("click", () => {
  loadMemories("", document.getElementById("mem-type-filter").value);
});
document.getElementById("mem-type-filter").addEventListener("change", () => {
  loadMemories(document.getElementById("mem-search").value, document.getElementById("mem-type-filter").value);
});

// --- Analytics tab ---
function barChart(series, keys, colors, height = 90) {
  const max = Math.max(1, ...series.flatMap(d => keys.map(k => d[k] || 0)));
  const bw = 100 / series.length;
  const bars = series.map((d, i) => keys.map((k, j) => {
    const h = ((d[k] || 0) / max) * (height - 18);
    const w = bw * 0.36;
    const x = i * bw + bw * 0.12 + j * (w + bw * 0.04);
    const delay = Math.min(i * 22, 300);
    return `<rect class="bar-anim" style="animation-delay:${delay}ms" x="${x}%" y="${height - 14 - h}" width="${w}%" height="${h}" fill="${colors[j]}"><title>${d.date}: ${d[k] || 0} ${k}</title></rect>`;
  }).join("")).join("");
  const labels = series.map((d, i) => i % Math.ceil(series.length / 7) === 0
    ? `<text x="${i * bw + bw / 2}%" y="${height - 2}" font-size="8" text-anchor="middle" style="fill:var(--faint)">${d.date.slice(5)}</text>` : "").join("");
  return `<svg viewBox="0 0 100 ${height}" preserveAspectRatio="none" style="width:100%;height:${height}px">${bars}${labels}</svg>`;
}

function legend(pairs) {
  return `<small style="color:var(--faint);font-weight:400;letter-spacing:0;text-transform:none">${pairs
    .map(([label, color]) => `<span style="color:${color}">■</span> ${label}`)
    .join(" · ")}</small>`;
}

async function loadAnalytics() {
  const el = document.getElementById("analytics-content");
  el.innerHTML = '<div class="empty">Loading…</div>';
  const res = await fetch(`${API}/v1/analytics?days=14`);
  if (!res.ok) { el.innerHTML = '<div class="empty">Analytics unavailable — is the API healthy?</div>'; return; }
  const a = await res.json();
  const hasActivity = a.activity.some(d => d.writes || d.retrieves);
  if (!hasActivity) {
    el.innerHTML = '<div class="empty">No activity in the last 14 days. Write or retrieve a memory and the charts will fill in.</div>';
    return;
  }
  const pct = (x) => (x * 100).toFixed(0) + "%";
  const hotRows = a.hot.map(h =>
    `<tr><td><span class="clickable" onclick="openDrawer('${h.id}')">${h.id.slice(0, 12)}</span></td><td><span class="tag">${esc(h.type)}</span></td><td>${esc(h.preview)}</td><td style="text-align:right;font-family:var(--mono)">${h.count}</td></tr>`
  ).join("");
  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card" style="grid-column:1/-1">
        <h3>Activity — last ${a.days} days ${legend([["writes", "var(--green)"], ["retrievals", "var(--cobalt)"]])}</h3>
        ${barChart(a.activity, ["writes", "retrieves"], ["var(--green)", "var(--cobalt)"])}
      </div>
      <div class="stat-card">
        <h3>Retrieval quality</h3>
        <p>${a.retrieval.total} retrievals · avg ${a.retrieval.avgLatencyMs}ms · avg ${a.retrieval.avgCandidates} candidates</p>
        <p style="margin-top:6px">Empty-result rate: <b>${pct(a.retrieval.emptyRate)}</b> · Dedup rate: <b>${pct(a.retrieval.dedupRate)}</b></p>
      </div>
      <div class="stat-card">
        <h3>Cold share</h3>
        <p><b>${a.cold.neverRetrieved}</b> of ${a.cold.active} active memories never retrieved in window</p>
      </div>
      <div class="stat-card" style="grid-column:1/-1">
        <h3>Lifecycle ${legend([["supersedes", "var(--amber)"], ["conflict resolutions", "var(--red)"]])}</h3>
        ${barChart(a.lifecycle, ["supersedes", "conflicts"], ["var(--amber)", "var(--red)"])}
      </div>
      <div class="stat-card" style="grid-column:1/-1">
        <h3>Hot memories</h3>
        <table><thead><tr><th>ID</th><th>Type</th><th>Preview</th><th style="text-align:right">Hits</th></tr></thead>
        <tbody>${hotRows || "<tr><td colspan='4' class='empty' style='padding:16px'>No retrievals in window</td></tr>"}</tbody></table>
        <p style="margin-top:8px;color:var(--faint);font-size:11px">${esc(a.auditWindowNote)}</p>
      </div>
    </div>`;
}

// --- Health tab ---
async function loadHealth() {
  const hc = document.getElementById("health-content");
  if (!hc.innerHTML) hc.innerHTML = '<div class="empty">Loading…</div>';
  const [statsRes, digestRes] = await Promise.all([
    fetch(`${API}/v1/stats`),
    fetch(`${API}/v1/digest?maxItems=5`),
  ]);
  const stats = await statsRes.json();
  const digest = await digestRes.json();

  const typeStatusRows = Object.entries(stats.countsByTypeStatus).map(([k, v]) => {
    const [type, status] = k.split(":");
    return `<tr><td>${type}</td><td><span class="status-${status}">${status}</span></td><td>${v}</td></tr>`;
  }).join("");

  const jobRows = Object.entries(stats.lastJobs || {}).map(([kind, info]) => {
    return `<tr><td>${kind}</td><td>${formatTime(info.updatedAt)}</td><td><pre style="font-size:11px;white-space:pre-wrap">${esc(JSON.stringify(info.result, null, 0))}</pre></td></tr>`;
  }).join("");

  document.getElementById("health-content").innerHTML = `
    <div class="stat-grid">
      <div class="stat-card">
        <h3>Memory counts</h3>
        <table><thead><tr><th>Type</th><th>Status</th><th>Count</th></tr></thead><tbody>${typeStatusRows || "<tr><td colspan='3'>No memories</td></tr>"}</tbody></table>
      </div>
      <div class="stat-card">
        <h3>Embedding coverage</h3>
        <p>${stats.embeddingCoverage.withVector} / ${stats.embeddingCoverage.total} memories have vectors</p>
        <p style="margin-top:8px">Provider: <code>${esc(stats.embedder || "unknown")}</code></p>
        <p style="margin-top:8px">Quarantine: ${stats.quarantineCount} items</p>
      </div>
      <div class="stat-card">
        <h3>Last jobs</h3>
        <table><thead><tr><th>Kind</th><th>When</th><th>Result</th></tr></thead><tbody>${jobRows || "<tr><td colspan='3'>No jobs run yet</td></tr>"}</tbody></table>
      </div>
      <div class="stat-card">
        <h3>Digest preview</h3>
        <p style="white-space:pre-wrap;font-family:var(--mono);font-size:12.5px">${esc(digest.text || "Nothing yet — pinned and high-importance memories appear here.")}</p>
      </div>
    </div>
  `;
}

// --- Utils ---
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const now = Date.now();
  const diff = now - d.getTime();
  if (diff < 60000) return `${Math.round(diff / 1000)}s ago`;
  if (diff < 3600000) return `${Math.round(diff / 60000)}m ago`;
  return d.toLocaleTimeString();
}
function daysSince(iso) { return (Date.now() - Date.parse(iso)) / 86400000; }
function summarizeJob(d) {
  const parts = [];
  for (const [k, v] of Object.entries(d)) {
    if (k === "kind" || typeof v !== "number" || v === 0) continue;
    parts.push(`${v} ${k.replace(/([A-Z])/g, " $1").toLowerCase()}`);
  }
  return parts.join(", ") || "nothing to do";
}

startFeed();
