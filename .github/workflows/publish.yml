name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify tag matches package version
        working-directory: apps/mcp-server
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi
      - run: pnpm --filter synapse-os build
      # OIDC trusted publishing (configured on npmjs.com for this repo+workflow):
      # no NPM_TOKEN, no OTP. Requires npm >= 11.5; the runner ships 10.x.
      - run: npm install -g npm@latest
      - name: Publish (skip if version already on registry)
        working-directory: apps/mcp-server
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "synapse-os@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "synapse-os@$PKG_VERSION already published — skipping."
          else
            npm publish --provenance --access public
          fi
